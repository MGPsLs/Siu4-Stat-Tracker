<!DOCTYPE html>
<html>
  <head>
    <title>
      Siu4 Stat Tracker
    </title>
    <link rel="stylesheet" href="text.css">
  </head>

  <body>
    <div class="banner">
      <p>Siu4 Basketball Stat Tracker</p>
    </div>
    <div class="addPlayerBox"> 
      <p class="subheader">Add a player to start tracking!</p>
      <form id="playerForm">
        <input type="text" id="name" placeholder="Player Name" required>
        <input type="text" id="number" placeholder="Shirt Number" required>
        <button type="submit" id="addNewPlayer">Add</button>
      </form>
    </div>
    <div>
      <table class="table" id="playerTable">
        <caption>
        PLAYERS
        </caption>
        <thead>
          <tr>
            <th>Number</th>
            <th>Name</th>
            <th>Points</th>
            <th>Assists</th>
            <th>Rebounds</th>
            <th>FGM</th>
            <th>FGA</th>
            <th>3PM</th>
            <th>3PA</th>
            <th>FTM</th>
            <th>FTA</th>
            <th>Steals</th>
            <th>Blocks</th>
            <th>TO</th>
            <th>PF</th>
            <th>EDIT</th>
          </tr>
        </thead>
        <tbody id="playerTableBody">
          <!-- Player's data will be dynamically added here -->
        </tbody>  
      </table>
    </div>
    <script src="/backend/retrievePlayer.js"></script>
    <script src="/backend/edit.js"></script>
    <script src="/backend/addPlayer.js"></script>
  </body>
</html>
